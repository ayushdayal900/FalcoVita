# version: '3.8'

# -----------------------------------
# Common Environment Variables
# -----------------------------------

x-common-env: &common-env
  FLASK_ENV: development

  # Security
  SECRET_KEY: ${SECRET_KEY}
  SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}

  # Database
  DATABASE_URL: ${DATABASE_URL}

  # Redis / Celery
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

  # Mail
  SMTP_SERVER: mailhog
  SMTP_PORT: 1025
  SMTP_EMAIL: noreply@hospital.com
  SMTP_PASSWORD: ${SMTP_PASSWORD}

  # Integrations
  GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL}

  OPENAI_API_KEY: ${OPENAI_API_KEY}
  PINECONE_API_KEY: ${PINECONE_API_KEY}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}


services:

  # -----------------------------------
  # Backend
  # -----------------------------------

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: falcovita_backend
    
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      <<: *common-env

    depends_on:
      - redis

    networks:
      - falcovita_network


  # -----------------------------------
  # Celery Worker
  # -----------------------------------

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: falcovita_celery_worker

    restart: unless-stopped

    command: celery -A backend.celery_config.celery_app worker --loglevel=info

    environment:
      <<: *common-env

    depends_on:
      - redis

    networks:
      - falcovita_network


  # -----------------------------------
  # Celery Beat
  # -----------------------------------

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: falcovita_celery_beat

    restart: unless-stopped

    command: celery -A backend.celery_config.celery_app beat --loglevel=info

    environment:
      <<: *common-env

    depends_on:
      - redis

    networks:
      - falcovita_network


  # -----------------------------------
  # Frontend
  # -----------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: falcovita_frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - falcovita_network


  # -----------------------------------
  # Redis
  # -----------------------------------

  redis:
    image: redis:7-alpine

    container_name: falcovita_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - falcovita_network


  # -----------------------------------
  # Mailhog
  # -----------------------------------

  
  mailhog:
    image: mailhog/mailhog

    container_name: falcovita_mailhog

    restart: unless-stopped

    ports:
      - "1026:1025"
      - "8026:8025"

    networks:
      - falcovita_network



  # -----------------------------------
  # OpenSearch
  # -----------------------------------

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: falcovita_opensearch
    restart: unless-stopped
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - falcovita_network

  # -----------------------------------
  # Prometheus
  # -----------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: falcovita_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - falcovita_network
    depends_on:
      - backend

  # -----------------------------------
  # Grafana
  # -----------------------------------

  grafana:
    image: grafana/grafana:latest
    container_name: falcovita_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - falcovita_network
    depends_on:
      - prometheus

  # -----------------------------------
  # Loki (Log Aggregation)
  # -----------------------------------

  loki:
    image: grafana/loki:2.9.0
    container_name: falcovita_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/data
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - falcovita_network

  # -----------------------------------
  # Promtail (Log Collector / Forwarder)
  # -----------------------------------

  promtail:
    image: grafana/promtail:2.9.0
    container_name: falcovita_promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml
      # Mount docker socket and containers directory to read logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - falcovita_network
    depends_on:
      - loki


# -----------------------------------
# Volumes
# -----------------------------------

volumes:
  redis_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
  loki_data:


# -----------------------------------
# Networks
# -----------------------------------

networks:
  falcovita_network:
    driver: bridge

